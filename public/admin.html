<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Сброс времени</title><style>body{font:18px system-ui;max-width:540px;margin:60px auto;padding:24px;background:#151515;color:#eee}input,button{box-sizing:border-box;width:100%;padding:14px;margin:12px 0;font:inherit}button{background:#ffd128;border:0;cursor:pointer}</style><h1>Сброс времени участников</h1><p>Все накопленные часы будут обнулены. Бот продолжит считать время заново. Панель в мире обновится после публикации.</p><form id="form"><label>Ключ администратора PLAYTIME_ADMIN_SECRET<input id="secret" type="password" autocomplete="off" required></label><label>Для подтверждения напиши СБРОС<input id="confirmText" autocomplete="off" required></label><button>Обнулить время участников</button></form><p id="status" role="status"></p><script>
form.onsubmit=async e=>{e.preventDefault();if(confirmText.value!=='СБРОС'){statusText('Напиши СБРОС для подтверждения.');return}if(!confirm('Обнулить время всех участников?'))return;const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/playtime',{method:'POST',headers:{Authorization:'Bearer '+secret.value,'X-Playtime-Action':'reset-confirmed'},cache:'no-store'});const data=await r.json();statusText(r.ok&&data.status==='reset'?'Время обнулено. Панель обновится после следующей публикации.':data.status==='busy'?'Бот сейчас обновляет данные. Повтори через минуту.':r.status===401?'Неверный ключ администратора.':'Сброс не выполнен: '+data.status)}catch{statusText('Не удалось получить ответ. Проверь панель перед повторным сбросом.')}finally{secret.value='';button.disabled=false}};function statusText(s){document.getElementById('status').textContent=s}
</script></html>
