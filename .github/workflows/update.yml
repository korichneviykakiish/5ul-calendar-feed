name: update-calendar-feed

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      login_action:
        description: "check-login: authenticate only; auto: update; request-email/verify-email: manual email login"
        type: choice
        default: auto
        options:
          - auto
          - check-login
          - request-email
          - verify-email
  push:
    branches: [main]
    paths:
      - groups.json
      - fetch_events.py
      - session_state.py
      - test_feed.py
      - requirements.txt
      - .github/workflows/update.yml

permissions:
  contents: read

concurrency:
  group: calendar-feed
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  update:
    needs: test
    # Keep the old live calendar untouched until the new account is ready.
    if: vars.FEED_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.login_action != 'auto')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore encrypted session
        uses: actions/cache/restore@v4
        with:
          path: state/cookies.enc
          key: vrc-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vrc-encrypted-v1-

      - name: Fetch events with owner's VRChat account
        id: fetch
        env:
          VRC_USERNAME: ${{ secrets.VRC_USERNAME }}
          VRC_PASSWORD: ${{ secrets.VRC_PASSWORD }}
          VRC_TOTP_SECRET: ${{ secrets.VRC_TOTP_SECRET }}
          VRC_EMAIL_CODE: ${{ secrets.VRC_EMAIL_CODE }}
          VRC_LOGIN_ACTION: ${{ inputs.login_action || 'auto' }}
          VRC_CONTACT: ${{ secrets.VRC_CONTACT }}
          VRC_SESSION_KEY: ${{ secrets.VRC_SESSION_KEY }}
        run: python fetch_events.py

      - name: Save encrypted session only
        if: always() && hashFiles('state/cookies.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state/cookies.enc
          key: vrc-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit feed
        if: steps.fetch.outputs.publish == 'true'
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "calendar-feed-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/events.json
            git commit -m "chore: update events feed"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.publish == 'true'
        with:
          path: docs
      - name: Publish calendar
        if: steps.fetch.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
